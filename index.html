          <span class="tag" style="color:var(--bad)">unrecognised format</span></div>`}const opts=checking.map(a=>`<option value="${esc(a.statement_ref)}" ${p.ref===a.statement_ref?"selected":""}>${esc(a.name)}</option>`).join("");return`<div class="f"><span class="n">${esc(p.file.name)}</span>
        ${p.fmt.needsAccount?`<select data-i="${i}"><option value="">which account?</option>${opts}</select>`:`<span class="tag">${p.fmt.refs.map(r=>esc(acctByRef.get(r)?.name??r+" (unknown)")).join(", ")}</span>`}
      </div>`}).join("");wrap.querySelectorAll(".files select").forEach(sel=>{sel.onchange=()=>{picked[sel.dataset.i].ref=sel.value;draw()}});$("go").disabled=!picked.length||picked.some(p=>!p.fmt.kind||p.fmt.needsAccount&&!p.ref)};const take=async fileList=>{for(const file of fileList){const text=await file.text();const fmt=detectImportFormat(text,file.name,checkingRefs);picked.push({file,text,fmt,ref:fmt.needsAccount?fmt.refs[0]??"":""})}draw()};$("drop").onclick=()=>$("picker").click();$("picker").onchange=ev=>take(ev.target.files);$("drop").ondragover=ev=>{ev.preventDefault();$("drop").classList.add("over")};$("drop").ondragleave=()=>$("drop").classList.remove("over");$("drop").ondrop=ev=>{ev.preventDefault();$("drop").classList.remove("over");take(ev.dataTransfer.files)};$("cancel").onclick=()=>wrap.remove();wrap.onclick=ev=>{if(ev.target===wrap)wrap.remove()};$("go").onclick=async()=>{$("go").disabled=true;$("go").textContent="Importing…";$("files").innerHTML="";const log=(msg,cls="")=>{$("files").insertAdjacentHTML("beforeend",`<div class="logline ${cls}">${esc(msg)}</div>`)};const catByName=new Map(d.cats.map(c=>[`${c.entity}|${c.name}`,c]));const{data:dbRules}=await db.from("rules").select("pattern,priority,category_id");const catById=new Map(d.cats.map(c=>[c.id,c]));const rules=(dbRules??[]).map(r=>({pattern:r.pattern,priority:r.priority,category:catById.get(r.category_id)?.name})).filter(r=>r.category);const{grandNew,grandSkipped}=await importFiles(picked,{acctByRef,catByName,rules,internalRefs},log);log(`${grandNew} new, ${grandSkipped} already present.`,"good");$("go").textContent="Done";$("cancel").textContent="Refresh";$("cancel").onclick=()=>{wrap.remove();render()}}}async function boot(){const{data}=await db.auth.getSession();if(data.session)render();else renderLogin()}db.auth.onAuthStateChange(e=>{if(e==="SIGNED_OUT")renderLogin()});activeTab=tabFromHash();window.addEventListener("hashchange",()=>showTab(tabFromHash(),{updateHash:false,scrollTop:true}));wireChartInteractions();window.addEventListener("pagehide",()=>{beSaver.flush();beNeedsResync=true});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){beSaver.flush();beNeedsResync=true}else if(dayHasRolledOver()){rolloverTried=calPacificIso();render()}else beResync()});function dayHasRolledOver(){if(!renderedIso||!document.getElementById("tab-overview"))return false;const t=calPacificIso();return t!==renderedIso&&t!==rolloverTried}window.addEventListener("pageshow",e=>{if(e.persisted)boot()});boot();
